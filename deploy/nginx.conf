# Защита от брутфорса и простого L7 DDoS
limit_req_zone $binary_remote_addr zone=omc_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=omc_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=omc_conn:10m;

upstream omc_app {
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Жёсткие таймауты против Slowloris-атак
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;
    client_max_body_size 32k;

    limit_conn omc_conn 15;
    limit_req_status 429;
    limit_conn_status 429;

    # Строгий лимит на авторизацию
    location = /api/v1/auth/login {
        limit_req zone=omc_login burst=3 nodelay;
        proxy_pass http://omc_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Вебхук от Platega (без жёсткого burst-отсечения, но с лимитом тела)
    location = /api/v1/payments/webhook {
        proxy_pass http://omc_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Остальное API
    location /api/ {
        limit_req zone=omc_api burst=15 nodelay;
        proxy_pass http://omc_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Веб-кабинет и админка
    location / {
        limit_req zone=omc_api burst=20 nodelay;
        proxy_pass http://omc_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
